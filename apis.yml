name: Coded
description: 'CODED is a Kuwait-based coding education and technology skills company
  offering hands-on bootcamps and programs for adults, youth, and kids. Its adult
  bootcamps cover Cybersecurity, Agentic AI, AI & Data Science, and AI App Development,
  while youth tracks (ages 14-24) and kids programs (ages 6-13) build foundational
  and career-oriented tech skills through projects, coaching, and real-world standards.
  CODED also delivers custom enterprise training for corporate teams. Surfaced as a
  500 Global portfolio company and added to the API Evangelist network; CODED is an
  education provider and publishes no public developer API, SDKs, or specifications.'
